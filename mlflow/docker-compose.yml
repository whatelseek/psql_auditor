services:
  mlflow:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.1.4}
    container_name: ${MLFLOW_CONTAINER_NAME:-psql-auditor-mlflow}
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/data/mlflow.db}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/data/artifacts}
    volumes:
      - ./data:/mlflow/data
    working_dir: /mlflow
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/data/mlflow.db}
      - --default-artifact-root
      - ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/data/artifacts}
      - --serve-artifacts
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
