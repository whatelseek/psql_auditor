services:
  # Optional local LiteLLM. Default uses InfraAx gateway from .env.
  #   docker compose --profile local-llm up --build
  litellm:
    profiles: ["local-llm"]
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-litellm-local}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    restart: unless-stopped

  # Results warehouse (sessions + filled REQ cells). Separate from audit-target PG_*.
  results-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${RESULTS_DB_USER:-results_admin}
      POSTGRES_PASSWORD: ${RESULTS_DB_PASSWORD:-results_lab_secret}
      POSTGRES_DB: ${RESULTS_DB_NAME:-postgres}
    volumes:
      - results-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESULTS_DB_USER:-results_admin} -d ${RESULTS_DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    ports:
      - "${AGENT_HOST_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://10.200.29.36:4443}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-litellm-local}
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-oss-120b}
      LITELLM_SSL_VERIFY: ${LITELLM_SSL_VERIFY:-false}
      AGENTS_DIR: /app/agents
      PLAYBOOKS_DIR: /app/agents/playbooks
      MEMORY_DIR: /app/memory
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_LEARN: ${MEMORY_LEARN:-true}
      TOOLS_DIR: /app/tools
      EVIDENCE_DIR: /app/artifacts
      HITL_ENABLED: ${HITL_ENABLED:-false}
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://open-webui:8080}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://localhost:3001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      # Lab: sign in to upload ZIP when API keys are disabled in Open WebUI
      OPEN_WEBUI_EMAIL: ${OPEN_WEBUI_EMAIL:-admin@localhost}
      OPEN_WEBUI_PASSWORD: ${OPEN_WEBUI_PASSWORD:-admin}
      MAX_SESSION_RETRIES: ${MAX_SESSION_RETRIES:-2}
      API_KEY: ${API_KEY:-sk-auditor-local}
      # SSH / PG / MCP: secrets/connection.md only (mounted below)
      SECRETS_DIR: /app/secrets
      INTAKE_ENABLED: ${INTAKE_ENABLED:-true}
      INVENTORY_DIR: /app/inventory
      # Lab default: skip known_hosts (set true for production)
      SSH_STRICT_HOST_KEY: ${SSH_STRICT_HOST_KEY:-false}
      # Results warehouse (not the audited Postgres target)
      RESULTS_DB_ENABLED: ${RESULTS_DB_ENABLED:-true}
      RESULTS_DATABASE_URL: ${RESULTS_DATABASE_URL:-postgresql://results_admin:results_lab_secret@results-db:5432/postgres}
      RESULTS_DB_PER_CLIENT: ${RESULTS_DB_PER_CLIENT:-true}
      RESULTS_DB_NAME_PREFIX: ${RESULTS_DB_NAME_PREFIX:-results_}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agents:/app/agents:ro
      - ./mcps:/app/mcps:ro
      - ./tools:/app/tools:ro
      - ./memory:/app/memory
      - ./artifacts:/app/artifacts
      - ./secrets:/app/secrets:ro
      - ./inventory:/app/inventory
      - ${SSH_KEY_HOST_PATH:-./.keys}:/keys:ro
    depends_on:
      results-db:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${WEBUI_HOST_PORT:-3001}:8080"
    environment:
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://agent:8000/v1
      OPENAI_API_BASE_URLS: http://agent:8000/v1
      OPENAI_API_KEY: ${API_KEY:-sk-auditor-local}
      OPENAI_API_KEYS: ${API_KEY:-sk-auditor-local}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      ENABLE_API_KEYS: ${ENABLE_API_KEYS:-true}
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"local-terminal","name":"MyTerminal","enabled":true,"url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY:-sk-open-terminal-local}","auth_type":"bearer"}]
      # Long audits; default Open WebUI client timeout is too short
      AIOHTTP_CLIENT_TIMEOUT: ${AIOHTTP_CLIENT_TIMEOUT:-3600}
      # Lab LiteLLM uses HTTPS with a private CA / self-signed cert
      AIOHTTP_CLIENT_SESSION_SSL: ${AIOHTTP_CLIENT_SESSION_SSL:-false}
    volumes:
      - open-webui-data:/app/backend/data
      - ${OWUI_AGENTS_PATH:-./agents}:/workspace/agents:ro
      - ${OWUI_ARTIFACTS_PATH:-./artifacts}:/workspace/artifacts
      - ${OWUI_INVENTORY_PATH:-./inventory}:/workspace/inventory
    depends_on:
      - agent
      - open-terminal
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:main
    group_add:
      - "${OPEN_TERMINAL_SUPP_GID:-1001}"
    working_dir: /home/user
    entrypoint: ["python", "-m", "uvicorn", "openterminal_compat:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${OPEN_TERMINAL_HOST_PORT:-9900}:8000"
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:-sk-open-terminal-local}
    volumes:
      - open-terminal-home:/home/user
      - ./openterminal_compat.py:/home/user/openterminal_compat.py:ro
      - ${OWUI_AGENTS_PATH:-./agents}:/home/user/workspace/agents:ro
      - ${OWUI_ARTIFACTS_PATH:-./artifacts}:/home/user/workspace/artifacts
      - ${OWUI_INVENTORY_PATH:-./inventory}:/home/user/workspace/inventory
    restart: unless-stopped

volumes:
  open-webui-data:
  results-db-data:
  open-terminal-home:
