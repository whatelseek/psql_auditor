# AUD-002 — mandatory quality gates via repository Make targets.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: format-check
        run: make format-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: lint
        run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: typecheck
        run: make typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: unit tests
        run: make test-unit

  integration:
    name: integration tests (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aud002
          POSTGRES_PASSWORD: aud002_ci_secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aud002 -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDITOR_TEST_DATABASE_URL: postgresql://aud002:aud002_ci_secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: integration tests
        run: make test-integration

  full-suite:
    name: full suite
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aud002
          POSTGRES_PASSWORD: aud002_ci_secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aud002 -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDITOR_TEST_DATABASE_URL: postgresql://aud002:aud002_ci_secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: full suite
        run: make test

  core-regression:
    name: CORE-001 / CORE-002 / CORE-003
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: make install-locked
      - name: Focused identity / job / result regressions
        run: |
          python -m pytest -q \
            tests/test_audit_run_job.py \
            tests/test_canonical_result_identity.py \
            tests/test_client_audit_run_identity.py
