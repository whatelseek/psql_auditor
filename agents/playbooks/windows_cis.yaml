framework_id: windows_cis
framework_tips:
  - Prefer PowerShell via ssh_run (pwsh -NoProfile -Command '...' or powershell.exe).
  - Keep commands non-interactive; avoid GUI tools.
requirements:
  REQ-001:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"net accounts\""
  REQ-002:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"net accounts\""
  REQ-003:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-NetFirewallProfile | Select-Object Name,Enabled | Format-Table -AutoSize | Out-String\""
  REQ-004:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"(Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -ErrorAction SilentlyContinue).UserAuthentication\""
  REQ-005:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol | Select-Object State | Format-List | Out-String\""
  REQ-006:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 10 HotFixID,InstalledOn | Format-Table -AutoSize | Out-String\""
  REQ-007:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"auditpol /get /category:*\""
  REQ-008:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-LocalGroupMember -Group Administrators | Select-Object Name,ObjectClass | Format-Table -AutoSize | Out-String\""
  REQ-009:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-MpComputerStatus | Select-Object AMRunningMode,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated | Format-List | Out-String\""
  REQ-010:
    tools:
      - name: ssh_run
        arguments:
          command: "powershell -NoProfile -Command \"Get-LocalUser -Name Guest | Select-Object Name,Enabled | Format-List | Out-String\""
