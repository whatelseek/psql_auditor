framework_id: ubuntu_cis_24_l2
framework_tips:
- Prefer non-interactive SSH commands from this playbook first.
- Large CIS scripts may need sudo; capture stdout and exit_code.
- Interpret PASS/FAIL markers in script output when present.
- Do not disable overlayfs/squashfs on container hosts without operator confirmation.
requirements:
  REQ-001:
    tools:
    - name: ssh_run
      arguments:
        command: "#!/bin/bash\n\n{\n   a_output=() a_output2=() a_output3=() l_dl=\"\" l_mod_name=\"overlayfs\"\
          \ l_mod_type=\"fs\"\n   l_mod_path=\"$(readlink -f /lib/modules/**/kernel/$l_mod_type | sort\
          \ -u)\"\n   f_module_chk()\n   {\n      l_dl=\"y\" a_showconfig=()\n      while IFS= read -r\
          \ l_showconfig; do\n         a_showconfig+=(\"$l_showconfig\")\n      done < <(modprobe --showconfig\
          \ | grep -P -- '\\b(install|blacklist)\\h+'\"${l_mod_chk_name//-/_}\"'\\b')\n      if ! lsmod\
          \ | grep \"$l_mod_chk_name\" &> /dev/null; then\n         a_output+=(\"  - kernel module: \\\
          \"$l_mod_name\\\" is not loaded\")\n      else\n         a_output2+=(\"  - kernel module: \\\
          \"$l_mod_name\\\" is loaded\")\n      fi\n      if grep -Pq -- '\\binstall\\h+'\"${l_mod_chk_name//-/_}\"\
          '\\h+(\\/usr)?\\/bin\\/(true|false)\\b' <<< \"${a_showconfig[*]}\"; then\n         a_output+=(\"\
          \  - kernel module: \\\"$l_mod_name\\\" is not loadable\")\n      else\n         a_output2+=(\"\
          \  - kernel module: \\\"$l_mod_name\\\" is loadable\")\n      fi\n      if grep -Pq -- '\\bblacklist\\\
          h+'\"${l_mod_chk_name//-/_}\"'\\b' <<< \"${a_showconfig[*]}\"; then\n         a_output+=(\"\
          \  - kernel module: \\\"$l_mod_name\\\" is deny listed\")\n      else\n         a_output2+=(\"\
          \  - kernel module: \\\"$l_mod_name\\\" is not deny listed\")\n      fi\n   }\n   for l_mod_base_directory\
          \ in $l_mod_path; do\n      if [ -d \"$l_mod_base_directory/${l_mod_name/-/\\/}\" ] && [ -n\
          \ \"$(ls -A \"$l_mod_base_directory/${l_mod_name/-/\\/}\")\" ]; then\n         a_output3+=(\"\
          \  - \\\"$l_mod_base_directory\\\"\")\n         l_mod_chk_name=\"$l_mod_name\"\n         [[\
          \ \"$l_mod_name\" =~ overlay ]] && l_mod_chk_name=\"${l_mod_name::-2}\"\n         [ \"$l_dl\"\
          \ != \"y\" ] && f_module_chk\n      else\n         a_output+=(\" - kernel module: \\\"$l_mod_name\\\
          \" doesn't exist in \\\"$l_mod_base_directory\\\"\")\n      fi\n   done\n   [ \"${#a_output3[@]}\"\
          \ -gt 0 ] && printf '%s\\n' \"\" \" -- INFO --\" \" - modul\n# … truncated for playbook …"
    notes: CIS 1.1.1.6
