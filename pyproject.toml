[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditor"
version = "0.1.0"
description = "LangGraph IT infrastructure security auditor with Open WebUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "aiosqlite>=0.20.0",
  "langchain-mcp-adapters>=0.3.0",
  "litellm>=1.50.0",
  "asyncssh>=2.17.0",
  "pywinrm>=0.4.3",
  "asyncpg>=0.30.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "sse-starlette>=2.1.0",
  "pyyaml>=6.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pip-tools>=7.4.0",
]

[project.scripts]
auditor = "auditor.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.hatch.build.targets.sdist]
include = ["src/auditor", "agents", "mcps", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "unit: fast in-process tests (default; no external services)",
  "integration: PostgreSQL / live-service tests (isolated disposable resources)",
  "external_llm: optional real-provider tests; require AUDITOR_ALLOW_EXTERNAL_LLM=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["auditor"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
# AUD-002: type checking is a mandatory green gate.
